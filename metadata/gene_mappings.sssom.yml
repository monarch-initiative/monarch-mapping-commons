mapping_set_description: The monarch gene mappings, based on HGNC and ENSEMBL base mappings.
mapping_set_id: https://data.monarchinitiative.org/mappings/gene_mappings.sssom.tsv
mapping_set_source: https://w3id.org/biopragmatics/biomappings/sssom/biomappings.sssom.tsv
# No curie_map here on purpose.
#
# It is generated into <output_dir>/gene_mappings.sssom.yml by `gene-mapping generate`,
# taken from the same prefixmaps converter that standardizes the CURIEs, and that file is
# what `sssom parse -m` consumes. So the published expansions always say how these
# identifiers were actually produced, every emitted prefix is declared without anyone
# maintaining a list, and there is one convention throughout rather than a mix of registry
# URIs and human-facing resolver URLs.
#
# Add descriptive fields above as normal; do not reintroduce a curie_map.
