mapping_set_description: The monarch gene mappings, based on HGNC and ENSEMBL base mappings.
mapping_set_id: https://data.monarchinitiative.org/mappings/gene_mappings.sssom.tsv
mapping_set_source: https://w3id.org/biopragmatics/biomappings/sssom/biomappings.sssom.tsv
curie_map:
  # Mixed conventions, deliberately left as found: most entries here are human-facing
  # resolver URLs predating this file's current use, while SGD, dictyBase and HGNC use the
  # registry URI from the prefixmaps profile. Only the latter three match what
  # src/monarch_gene_mapping/main.py standardizes the CURIEs against (prefixmaps "merged").
  # Normalizing the rest is tracked separately -- see the LOINC/SNOMED pass in #92 -- and
  # OMIM below is a known defect, not a convention.
  dictyBase: http://identifiers.org/dictybase.gene/
  FB: https://flybase.org/reports/
  HGNC: http://identifiers.org/hgnc/
  OMIM: https://omim.org/MIM  # BUG: missing ':' -- expands to omim.org/MIM100100. See #95
  PomBase: https://identifiers.org/pombase/
  RGD: http://rgd.mcw.edu/rgdweb/report/gene/main.html?id=
  SGD: http://identifiers.org/sgd/
  UniProtKB: http://purl.uniprot.org/uniprot/
  WB: https://www.wormbase.org/get?name=
  Xenbase: https://www.xenbase.org/entry/
  ZFIN: http://zfin.org/