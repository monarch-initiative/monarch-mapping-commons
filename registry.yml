mapping_registry_id: https://w3id.org/sssom/commons/monarch
mapping_registry_title: Monarch Mapping Commons
mapping_registry_description: A collection of the SSSOM-format mappings used for the Monarch Initiative knowledge graph
homepage: https://github.com/monarch-initiative/monarch-mapping-commons

mapping_set_references:
  # MONDO disease mappings
  - mapping_set_id: http://purl.obolibrary.org/obo/mondo/mappings/mondo.sssom.tsv
    mapping_set_group: disease_mappings
    local_name: mondo.sssom.tsv
    mapping_set_confidence: "0.99"
    other:
      local_id: mondo

  # Monarch subset of Biomappings (CHEBI-MESH mappings)
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/mesh_chebi_biomappings.sssom.tsv
    mapping_set_group: chemical_mappings
    local_name: mesh_chebi_biomappings.sssom.tsv
    mirror_from: https://w3id.org/biopragmatics/biomappings/sssom/biomappings.sssom.tsv
    mapping_set_confidence: "0.9"

  # Monarch Gene Mappings
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/gene_mappings.sssom.tsv
    mapping_set_group: gene_mappings
    local_name: gene_mappings.sssom.tsv
    mirror_from: https://data.monarchinitiative.org/monarch-gene-mapping/latest/gene_mappings.sssom.tsv
    mapping_set_confidence: "0.9"
  
  # HP-SNOMED Mappings
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/hpo-snomed.sssom.tsv
    mapping_set_group: phenotype
    local_name: hpo-snomed.sssom.tsv
    mapping_set_confidence: "0.99"  
  
  # HP-Mesh Mappings
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/hp_mesh.sssom.tsv
    mapping_set_group: phenotype
    local_name: hp_mesh.sssom.tsv
    mirror_from: https://raw.githubusercontent.com/monarch-initiative/umls-ingest/main/src/umls_ingest/mappings/hp_mesh.sssom.tsv
    mapping_set_confidence: "0.9"  
    
  # HP-NCIT Mappings (manual lexmatch run)
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/ncit-hp.sssom.tsv
    mapping_set_group: phenotype
    local_name: ncit-hp.sssom.tsv
    mapping_set_confidence: "0.9"

  # UMLS-HP Mappings
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/umls_hp.sssom.tsv
    mapping_set_group: phenotype
    local_name: umls_hp.sssom.tsv
    mirror_from: https://raw.githubusercontent.com/monarch-initiative/umls-ingest/main/src/umls_ingest/mappings/umls_hp.sssom.tsv
    mapping_set_confidence: "0.9"

  # uPheno Custom Mappings (product of current uPheno pipeline)
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/upheno-cross-species.sssom.tsv
    mapping_set_group: phenotype
    local_name: upheno-cross-species.sssom.tsv
    mirror_from: https://raw.githubusercontent.com/obophenotype/upheno/refs/heads/master/src/mappings/upheno-cross-species.sssom.tsv
    mapping_set_confidence: "1"

  # uPheno species independent mappings (product of current uPheno pipeline)
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/upheno-species-independent.sssom.tsv
    mapping_set_group: phenotype
    local_name: upheno-species-independent.sssom.tsv
    mirror_from: https://raw.githubusercontent.com/obophenotype/upheno/refs/heads/master/src/mappings/upheno-species-independent.sssom.tsv
    mapping_set_confidence: "1"

  # Uberon species independent mappings (product of current uPheno pipeline)
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/uberon.sssom.tsv
    mapping_set_group: phenotype
    local_name: uberon.sssom.tsv
    mirror_from: https://github.com/obophenotype/uberon/releases/latest/download/uberon.sssom.tsv
    mapping_set_confidence: "1"
  
  # NBO-GO mapping
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/nbo-go.sssom.tsv
    mapping_set_group: phenotype
    local_name: nbo-go.sssom.tsv
    mirror_from: https://raw.githubusercontent.com/obophenotype/upheno/refs/heads/master/src/mappings/nbo-go.sssom.tsv
    mapping_set_confidence: "1"

  # MONDO-HP cross references
  - mapping_set_id: http://purl.obolibrary.org/obo/mondo/mappings/mondo_hasdbxref_hp.sssom.tsv
    mapping_set_group: disease_mappings
    local_name: mondo_hasdbxref_hp.sssom.tsv
    mapping_set_confidence: "0.9"

  # MONDO-HP lexical matches
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/mondo_hp_lexical.sssom.tsv
    mapping_set_group: disease_mappings
    local_name: mondo_hp_lexical.sssom.tsv
    mapping_set_confidence: "0.8"

  # LOINC part mappings (see monarch-mapping-commons#35)
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/loinc2chebi_1.sssom.tsv
    mapping_set_group: measurement_mappings
    local_name: loinc2chebi_1.sssom.tsv
    mapping_set_confidence: "0.9"
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/loinc2chebi_2.sssom.tsv
    mapping_set_group: measurement_mappings
    local_name: loinc2chebi_2.sssom.tsv
    mapping_set_confidence: "0.9"
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/loincpart2cl.sssom.tsv
    mapping_set_group: measurement_mappings
    local_name: loincpart2cl.sssom.tsv
    mapping_set_confidence: "0.9"
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/loincpart2go.sssom.tsv
    mapping_set_group: measurement_mappings
    local_name: loincpart2go.sssom.tsv
    mapping_set_confidence: "0.9"
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/loincpart2ncbitaxon.sssom.tsv
    mapping_set_group: measurement_mappings
    local_name: loincpart2ncbitaxon.sssom.tsv
    mapping_set_confidence: "0.9"
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/loincpart2ncit.sssom.tsv
    mapping_set_group: measurement_mappings
    local_name: loincpart2ncit.sssom.tsv
    mapping_set_confidence: "0.9"
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/loincpart2pr.sssom.tsv
    mapping_set_group: measurement_mappings
    local_name: loincpart2pr.sssom.tsv
    mapping_set_confidence: "0.9"
  - mapping_set_id: http://w3id.org/sssom/commons/monarch/mappings/loincpart2uberon.sssom.tsv
    mapping_set_group: measurement_mappings
    local_name: loincpart2uberon.sssom.tsv
    mapping_set_confidence: "0.9"
