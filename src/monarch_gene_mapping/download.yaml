  # Ensembl
  #
  # NCBI's gene2ensembl carries only one Ensembl gene ID series per species, but our
  # ingest sources are pinned to assorted genome assemblies and use whichever series
  # was current when they were built. PantherDB is frozen at 2024-04-02, for instance,
  # and emits ROS_Cfam_1.0 dog IDs (ENSCAFG00845*) while gene2ensembl now carries only
  # CanFam3.1 (ENSCAFG00000*). Pulling the per-assembly entrez xrefs straight from
  # Ensembl lets both series resolve to the same NCBIGene node.
  #
  # Files here are pinned by release deliberately. Do not "upgrade" one in place -- an
  # older release is often the only source of a retired ID series, and even within one
  # series a newer release can drop xrefs the older one had. Add releases, don't replace
  # them; the mappings are unioned.
-
  url: https://ftp.ensembl.org/pub/release-113/tsv/bos_taurus/Bos_taurus.ARS-UCD1.3.113.entrez.tsv.gz
  local_name: data/ensembl/Bos_taurus.ARS-UCD1.3.113.entrez.tsv.gz
  tag: ensembl
